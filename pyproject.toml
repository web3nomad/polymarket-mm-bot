[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "polymarket-mm-bot"
version = "0.1.0"
description = "Polymarket semi-HFT market-making bot scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Your Name" }]
dependencies = [
  "PyYAML>=6.0.1,<7.0",
  "requests>=2.32.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
polymarket-mm-bot = "polymarket_mm_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mm_bot"]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]
