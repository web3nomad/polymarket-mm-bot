risk:
  total_capital: 10000
  strategy_capital: 2500
  per_trade_risk_pct: 0.5
  market_exposure_pct: 8
  theme_exposure_pct: 20
  daily_drawdown_stop_pct: 3
  max_open_orders: 200

market_selection:
  top_n: 8
  min_liquidity: 2000
  max_spread_bps: 350
  min_minutes_to_expiry: 60

strategy:
  quote_refresh_sec: 2.0
  quote_half_spread_bps: 30
  inventory_skew_bps_per_contract: 2.0
  max_inventory_contracts: 120

execution:
  mode: paper
  default_order_size: 8
  slippage_bps: 5

telemetry:
  db_path: data/paper_runs.sqlite3
  persist_positions_every_loop: true

runtime:
  dry_run: true
  log_level: INFO
