risk:
  total_capital: 5000
  strategy_capital: 1000
  per_trade_risk_pct: 0.6
  market_exposure_pct: 10
  theme_exposure_pct: 25
  daily_drawdown_stop_pct: 2
  max_open_orders: 120

market_selection:
  top_n: 5
  min_liquidity: 1000
  max_spread_bps: 500
  min_minutes_to_expiry: 45

strategy:
  quote_refresh_sec: 2.5
  quote_half_spread_bps: 40
  inventory_skew_bps_per_contract: 2.5
  max_inventory_contracts: 80

execution:
  mode: paper
  default_order_size: 5
  slippage_bps: 8

telemetry:
  db_path: data/paper_runs.sqlite3
  persist_positions_every_loop: true

runtime:
  dry_run: true
  log_level: INFO
