mode: live

gamma_url: "https://gamma-api.polymarket.com/markets"
run_interval_sec: 2
top_n: 5
min_liquidity: 1000
min_spread: 0.02
order_size: 10
order_edge: 0.005
settlement_file: "settlement.jsonl"
request_timeout_sec: 8
fetch_limit: 200
min_minutes_to_expiry: 30
max_orders_per_loop: 20
kill_switch_file: ".halt"

risk:
  initial_equity: 1000
  max_order_notional: 20
  max_market_exposure: 100
  daily_loss_limit: 50

live:
  host: "https://clob.polymarket.com"
  chain_id: 137
  signature_type: 1
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  funder_env: "POLYMARKET_FUNDER"
  order_type: "FOK"
  min_order_usd: 1.0
  allow_sell: false
