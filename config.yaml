mode: live

gamma_url: "https://gamma-api.polymarket.com/markets"
run_interval_sec: 2
top_n: 20
min_liquidity: 500
min_spread: 0.005
min_minutes_to_expiry: 30
fetch_limit: 200
request_timeout_sec: 8
max_orders_per_loop: 20
kill_switch_file: ".halt"
settlement_file: "settlement.jsonl"

risk:
  initial_equity: 50
  max_order_notional: 6
  max_market_exposure: 12
  daily_loss_limit: 10
  use_kelly: true
  kelly_fraction: 0.5
  min_confidence: 0.3

strategies:
  market_making:
    enabled: true
    min_spread: 0.008
    edge: 0.005
    order_size: 10
  arbitrage:
    enabled: true
    threshold: 0.02
    order_size: 8
  momentum:
    enabled: true
    lookback_trades: 20
    buy_threshold: 0.3
    sell_threshold: -0.3
    order_size: 8
  mean_reversion:
    enabled: false
    lookback_trades: 50
    std_threshold: 2.0
    order_size: 20

live:
  host: "https://clob.polymarket.com"
  chain_id: 137
  signature_type: 1
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  funder_env: "POLYMARKET_FUNDER"
  order_type: "GTC"
  min_order_usd: 1.0
  exchange_min_order_usd: 1.0
  exchange_min_shares: 5
  allow_sell: false
  trade_side: "buy"
  marketable_buffer: 0.0
  sync_existing_positions: true
  sync_trade_pages: 3
  precheck_required: true
  market_cooldown_sec: 45
